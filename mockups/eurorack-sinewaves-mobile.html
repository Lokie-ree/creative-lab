<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINEWAVES — Mobile Mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --panel-bg: oklch(0.14 0.008 75);
    --panel-bg-inset: oklch(0.11 0.008 75);
    --panel-bg-deep: oklch(0.09 0.006 75);
    --silk: oklch(0.74 0.02 85);
    --silk-dim: oklch(0.52 0.02 75);
    --silk-faint: oklch(0.35 0.02 70);
    --silk-bright: oklch(0.84 0.015 90);
    --active: oklch(0.72 0.15 145);
    --active-dim: oklch(0.52 0.12 145);
    --active-bright: oklch(0.88 0.18 145);
    --sys-ok: oklch(0.52 0.08 145);
    --sys-ok-dim: oklch(0.42 0.08 145);
    --danger: oklch(0.52 0.12 25);
    --danger-dim: oklch(0.38 0.10 25);
    --led-off: oklch(0.20 0.01 80);
    --led-active: oklch(0.72 0.15 145);
    --led-done: oklch(0.52 0.08 145);
    --score: oklch(0.22 0.01 80);
    --screw-rim: oklch(0.35 0.01 80);
    --thumb-border: oklch(0.42 0.015 80);
    --text-tiny: clamp(0.4375rem, 1.5vw + 0.3rem, 0.5625rem);
    --text-label: clamp(0.5rem, 2vw + 0.35rem, 0.625rem);
    --text-body: clamp(0.7rem, 2vw + 0.4rem, 0.75rem);
    --text-formula: clamp(0.8rem, 2.5vw + 0.4rem, 0.875rem);
    --font-label: 'DM Sans', sans-serif;
    --font-data: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: oklch(0.07 0.005 60);
    min-height: 100vh;
    padding: 16px 12px;
    font-family: var(--font-label);
  }
  @media (min-width: 420px) {
    body { padding: 24px 16px; }
  }

  .mobile-frame {
    max-width: 390px;
    width: 100%;
    margin: 0 auto;
  }

  .module {
    background: var(--panel-bg);
    position: relative;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255,255,255,0.008) 1px, rgba(255,255,255,0.008) 2px);
    animation: module-entrance 0.4s ease-out both;
  }
  @media (prefers-reduced-motion: reduce) {
    .module { animation: none; }
  }
  @keyframes module-entrance {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .score { height: 1px; background: var(--score); margin: 0; }

  .status-strip {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    gap: 10px;
  }
  .nav-btn {
    display: flex; align-items: center; gap: 5px;
    color: var(--silk); font-size: var(--text-label); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    border: 1px solid var(--score); background: var(--panel-bg-inset);
    padding: 5px 10px;
    transition: border-color 0.2s ease-out, background-color 0.2s ease-out;
  }
  .nav-btn:hover { border-color: var(--silk-dim); background: var(--panel-bg-deep); }
  .nav-btn svg { width: 12px; height: 12px; stroke: currentColor; }
  .module-title {
    font-size: var(--text-label); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--silk);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px;
  }
  .progress-leds { display: flex; gap: 5px; margin-left: 2px; }
  .led { width: 6px; height: 6px; border-radius: 50%; background: var(--led-off); border: 1px solid var(--score); }
  .led.done { background: var(--led-done); border-color: var(--sys-ok-dim); }
  .led.active { background: var(--led-active); border-color: var(--active-dim); }
  .sys-status { margin-left: auto; display: flex; align-items: center; gap: 5px; font-family: var(--font-data); font-size: var(--text-tiny); color: var(--sys-ok); }
  .sys-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--sys-ok); }
  .esc-btn {
    font-size: var(--text-tiny); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--silk); border: 1px solid var(--score); background: var(--panel-bg-inset);
    padding: 5px 10px; cursor: pointer;
    transition: border-color 0.2s ease-out, background-color 0.2s ease-out;
  }
  .esc-btn:hover { border-color: var(--silk-dim); background: var(--panel-bg-deep); }

  .readout-row { display: flex; flex-direction: column; }
  .readout-cell { padding: 10px 12px; }
  .readout-cell + .readout-cell { border-top: 1px solid var(--score); }
  .readout-label { font-size: var(--text-tiny); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--silk-dim); margin-bottom: 4px; }
  .prompt-text { font-size: var(--text-body); font-weight: 500; color: var(--silk-bright); line-height: 1.4; }
  .prompt-text .hl { color: var(--active); }
  .formula { font-family: var(--font-data); font-size: var(--text-formula); font-weight: 500; color: var(--silk); }
  .formula .val { color: var(--active-bright); font-weight: 600; }
  .theta-line { font-family: var(--font-data); font-size: var(--text-label); color: var(--silk-dim); margin-top: 2px; }

  .viz-area { padding: 10px 12px; }
  .viz-container {
    background: var(--panel-bg-deep);
    height: 200px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--score);
  }
  .viz-grid { position: absolute; inset: 0; pointer-events: none; }
  .grid-line-minor { stroke: oklch(0.20 0.01 80); stroke-width: 0.5; }
  .grid-axis { stroke: oklch(0.28 0.01 80); stroke-width: 0.8; }
  .circle-placeholder {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 56px;
    height: 56px;
    border: 1.5px solid var(--silk-dim);
    border-radius: 50%;
  }
  .circle-placeholder .circle-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--active);
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
  }
  .circle-placeholder .circle-center {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--silk-faint);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .connector-line {
    position: absolute;
    left: 72px;
    top: 50%;
    width: 24px;
    border-top: 1px dashed var(--silk-faint);
  }
  .wave-container { position: absolute; left: 98px; right: 12px; top: 12px; bottom: 12px; }
  .wave-svg { width: 100%; height: 100%; }
  .wave-user { fill: none; stroke: var(--silk); stroke-width: 1.8; }
  .wave-ghost { fill: none; stroke: var(--silk-faint); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .wave-axis { stroke: var(--silk-faint); stroke-width: 0.5; }
  .viz-label { position: absolute; font-size: var(--text-tiny); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--silk-faint); bottom: 6px; right: 14px; }
  .viz-label.circle-label { left: 28px; right: auto; }

  .proximity-strip { padding: 4px 12px 0; display: flex; align-items: center; gap: 6px; }
  .proximity-bar-track { flex: 1; height: 2px; background: var(--panel-bg-inset); }
  .proximity-bar-fill { height: 100%; background: var(--active-dim); width: 65%; }
  .proximity-text { font-size: var(--text-tiny); font-weight: 500; color: var(--active); letter-spacing: 0.04em; }

  .control-strip { padding: 12px 12px 14px; }
  .controls-row { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .fader-group { width: 100%; }
  .fader-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .fader-label { font-size: var(--text-tiny); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--silk-dim); }
  .fader-label.highlighted { color: var(--active); }
  .fader-value { font-family: var(--font-data); font-size: var(--text-body); font-weight: 600; color: var(--silk); }
  .fader-value.highlighted { color: var(--active-bright); }
  .fader-track { position: relative; height: 26px; display: flex; align-items: center; }
  .fader-rail { width: 100%; height: 3px; background: var(--panel-bg-inset); position: relative; border-top: 1px solid oklch(0 0 0 / 0.3); }
  .fader-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--silk-faint); }
  .fader-fill.highlighted { background: var(--active-dim); }
  .fader-ticks { position: absolute; top: -3px; left: 0; right: 0; height: 26px; pointer-events: none; }
  .fader-tick { position: absolute; width: 1px; background: var(--silk-faint); opacity: 0.4; }
  .fader-tick.major { height: 6px; top: -2px; opacity: 0.6; }
  .fader-tick.minor { height: 3px; top: 1px; }
  .fader-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 18px; background: var(--screw-rim); border: 1px solid var(--thumb-border); cursor: pointer; }
  .fader-thumb.highlighted { border-color: var(--active-dim); }
  .fader-range { display: flex; justify-content: space-between; margin-top: 2px; }
  .fader-range-val { font-family: var(--font-data); font-size: var(--text-tiny); color: var(--silk-faint); }

  .button-group { display: flex; gap: 2px; justify-content: center; }
  .inst-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 6px 12px; min-width: 52px; background: var(--panel-bg-inset); border: 1px solid var(--score); cursor: pointer;
    transition: border-color 0.2s ease-out, background-color 0.2s ease-out;
  }
  .inst-btn:active { background: var(--panel-bg-deep); }
  .inst-btn svg { width: 12px; height: 12px; stroke-width: 1.8; }
  .inst-btn-label { font-size: var(--text-tiny); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--silk-dim); }
  .inst-btn.trace svg { stroke: var(--sys-ok); }
  .inst-btn.trace .inst-btn-label { color: var(--sys-ok-dim); }
  .inst-btn.reset svg { stroke: var(--danger); }
  .inst-btn.reset .inst-btn-label { color: var(--danger-dim); }
  .inst-btn.speed .speed-val { font-family: var(--font-data); font-size: var(--text-label); font-weight: 600; color: var(--silk); }

  .mobile-badge {
    text-align: center;
    font-size: var(--text-tiny);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--silk-faint);
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<div class="mobile-frame">
  <p class="mobile-badge">Mobile mockup · 390px</p>

  <div class="module">
    <div class="status-strip">
      <button class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> BACK</button>
      <span class="module-title">SINEWAVES</span>
      <div class="progress-leds">
        <div class="led done"></div>
        <div class="led done"></div>
        <div class="led active"></div>
        <div class="led"></div>
        <div class="led"></div>
      </div>
      <div class="sys-status"><div class="sys-dot"></div> SYS:NOM</div>
      <button class="esc-btn">ESC</button>
    </div>

    <div class="score"></div>

    <div class="readout-row">
      <div class="readout-cell">
        <div class="readout-label">OBSERVATION</div>
        <div class="prompt-text">Match the ghost wave — try the <span class="hl">amplitude</span> slider</div>
      </div>
      <div class="readout-cell">
        <div class="readout-label">FORMULA</div>
        <div class="formula">y = <span class="val">1.5</span> &middot; sin(1.0 t)</div>
        <div class="theta-line">&theta; = 0° (0° → 360°)</div>
      </div>
    </div>

    <div class="score"></div>

    <div class="viz-area">
      <div class="viz-container">
        <svg class="viz-grid" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <line x1="0" y1="50%" x2="100%" y2="50%" class="grid-axis"/>
          <line x1="25%" y1="0" x2="25%" y2="100%" class="grid-line-minor"/>
          <line x1="50%" y1="0" x2="50%" y2="100%" class="grid-line-minor"/>
          <line x1="75%" y1="0" x2="75%" y2="100%" class="grid-line-minor"/>
        </svg>
        <div class="circle-placeholder">
          <div class="circle-dot"></div>
          <div class="circle-center"></div>
        </div>
        <div class="connector-line"></div>
        <div class="wave-container">
          <svg class="wave-svg" viewBox="0 0 400 220" preserveAspectRatio="none">
            <path class="wave-ghost" d="M0,110 C25,30 75,30 100,110 C125,190 175,190 200,110 C225,30 275,30 300,110 C325,190 375,190 400,110"/>
            <path class="wave-user" d="M0,110 C25,42 75,42 100,110 C125,178 175,178 200,110 C225,42 275,42 300,110 C325,178 375,178 400,110"/>
          </svg>
        </div>
        <div class="viz-label circle-label">UNIT CIRCLE</div>
        <div class="viz-label">sin(&theta;)</div>
      </div>
    </div>

    <div class="proximity-strip">
      <div class="proximity-bar-track"><div class="proximity-bar-fill"></div></div>
      <span class="proximity-text">Getting closer...</span>
    </div>
    <div class="score" style="margin-top:6px;"></div>

    <div class="control-strip">
      <div class="controls-row">
        <div class="fader-group">
          <div class="fader-header">
            <span class="fader-label highlighted">AMPLITUDE</span>
            <span class="fader-value highlighted">1.2</span>
          </div>
          <div class="fader-track">
            <div class="fader-rail"><div class="fader-fill highlighted" style="width:60%;"></div></div>
            <div class="fader-ticks">
              <div class="fader-tick major" style="left:0%;"></div>
              <div class="fader-tick major" style="left:25%;"></div>
              <div class="fader-tick major" style="left:50%;"></div>
              <div class="fader-tick major" style="left:75%;"></div>
              <div class="fader-tick major" style="left:100%;"></div>
            </div>
            <div class="fader-thumb highlighted" style="left:60%;"></div>
          </div>
          <div class="fader-range"><span class="fader-range-val">0.0</span><span class="fader-range-val">2.0</span></div>
        </div>
        <div class="fader-group">
          <div class="fader-header">
            <span class="fader-label">FREQUENCY</span>
            <span class="fader-value">1.0</span>
          </div>
          <div class="fader-track">
            <div class="fader-rail"><div class="fader-fill" style="width:25%;"></div></div>
            <div class="fader-ticks">
              <div class="fader-tick major" style="left:0%;"></div>
              <div class="fader-tick major" style="left:25%;"></div>
              <div class="fader-tick major" style="left:50%;"></div>
              <div class="fader-tick major" style="left:75%;"></div>
              <div class="fader-tick major" style="left:100%;"></div>
            </div>
            <div class="fader-thumb" style="left:25%;"></div>
          </div>
          <div class="fader-range"><span class="fader-range-val">0.5</span><span class="fader-range-val">4.0</span></div>
        </div>
        <div class="button-group">
          <button class="inst-btn trace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span class="inst-btn-label">TRACE</span></button>
          <button class="inst-btn reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="inst-btn-label">RESET</span></button>
          <button class="inst-btn speed"><span class="speed-val">1x</span><span class="inst-btn-label">SPEED</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
